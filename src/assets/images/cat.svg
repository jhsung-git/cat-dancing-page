<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <!-- Body -->
  <ellipse cx="100" cy="170" rx="55" ry="60" fill="#f4a460"/>

  <!-- Head -->
  <circle cx="100" cy="90" r="50" fill="#f4a460"/>

  <!-- Left ear -->
  <polygon points="55,55 45,20 75,45" fill="#f4a460"/>
  <polygon points="58,52 50,28 72,46" fill="#ffb6c1"/>

  <!-- Right ear -->
  <polygon points="145,55 155,20 125,45" fill="#f4a460"/>
  <polygon points="142,52 150,28 128,46" fill="#ffb6c1"/>

  <!-- Face markings (forehead stripes) -->
  <line x1="90" y1="50" x2="85" y2="65" stroke="#d2691e" stroke-width="2" stroke-linecap="round"/>
  <line x1="100" y1="48" x2="100" y2="63" stroke="#d2691e" stroke-width="2" stroke-linecap="round"/>
  <line x1="110" y1="50" x2="115" y2="65" stroke="#d2691e" stroke-width="2" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="82" cy="82" rx="10" ry="12" fill="#2c2c2c"/>
  <ellipse cx="118" cy="82" rx="10" ry="12" fill="#2c2c2c"/>
  <!-- Eye shine -->
  <circle cx="86" cy="78" r="3" fill="white"/>
  <circle cx="122" cy="78" r="3" fill="white"/>
  <!-- Pupils -->
  <ellipse cx="82" cy="84" rx="5" ry="8" fill="#1a1a1a"/>
  <ellipse cx="118" cy="84" rx="5" ry="8" fill="#1a1a1a"/>

  <!-- Nose -->
  <polygon points="100,96 95,103 105,103" fill="#ff9eb5"/>

  <!-- Mouth -->
  <path d="M 95,103 Q 100,110 105,103" stroke="#d2691e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 95,103 Q 88,108 82,105" stroke="#d2691e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 105,103 Q 112,108 118,105" stroke="#d2691e" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Whiskers left -->
  <line x1="60" y1="98" x2="90" y2="100" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="58" y1="104" x2="88" y2="103" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="62" y1="110" x2="90" y2="106" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Whiskers right -->
  <line x1="140" y1="98" x2="110" y2="100" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="142" y1="104" x2="112" y2="103" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="138" y1="110" x2="110" y2="106" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Belly -->
  <ellipse cx="100" cy="175" rx="35" ry="40" fill="#ffdab9"/>

  <!-- Left arm -->
  <ellipse cx="52" cy="165" rx="14" ry="28" fill="#f4a460" transform="rotate(-15, 52, 165)"/>
  <!-- Right arm -->
  <ellipse cx="148" cy="165" rx="14" ry="28" fill="#f4a460" transform="rotate(15, 148, 165)"/>

  <!-- Left paw -->
  <ellipse cx="44" cy="190" rx="16" ry="10" fill="#f4a460"/>
  <ellipse cx="37" cy="192" rx="5" ry="4" fill="#ffdab9"/>
  <ellipse cx="44" cy="194" rx="5" ry="4" fill="#ffdab9"/>
  <ellipse cx="51" cy="192" rx="5" ry="4" fill="#ffdab9"/>

  <!-- Right paw -->
  <ellipse cx="156" cy="190" rx="16" ry="10" fill="#f4a460"/>
  <ellipse cx="149" cy="192" rx="5" ry="4" fill="#ffdab9"/>
  <ellipse cx="156" cy="194" rx="5" ry="4" fill="#ffdab9"/>
  <ellipse cx="163" cy="192" rx="5" ry="4" fill="#ffdab9"/>

  <!-- Left leg -->
  <ellipse cx="75" cy="225" rx="16" ry="18" fill="#f4a460"/>
  <!-- Right leg -->
  <ellipse cx="125" cy="225" rx="16" ry="18" fill="#f4a460"/>

  <!-- Left foot -->
  <ellipse cx="72" cy="237" rx="18" ry="8" fill="#f4a460"/>
  <!-- Right foot -->
  <ellipse cx="128" cy="237" rx="18" ry="8" fill="#f4a460"/>

  <!-- Tail -->
  <path d="M 150,200 Q 190,180 185,150 Q 180,120 160,130" stroke="#f4a460" stroke-width="12" fill="none" stroke-linecap="round"/>
  <circle cx="160" cy="130" r="8" fill="#f4a460"/>

  <!-- Music notes decoration -->
  <text x="15" y="50" font-size="20" fill="#ffd700" opacity="0.8">♪</text>
  <text x="165" y="40" font-size="16" fill="#ff69b4" opacity="0.8">♫</text>
  <text x="170" y="80" font-size="14" fill="#7fffd4" opacity="0.7">♩</text>
</svg>
